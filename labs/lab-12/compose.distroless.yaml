name: lab-12

services:
  db:
    image: postgres:16-alpine
    container_name: lab12-db
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: appdb
    volumes:
      - lab12_db_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d appdb"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "5435:5432"

  api:
    build:
      context: ./api
      dockerfile: Dockerfile.distroless
    image: dzth/lab12-notes-api:distroless-0.1
    container_name: lab12-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: "8080"
      DB_HOST: "db"
      DB_PORT: "5432"
      DB_NAME: "appdb"
      DB_USER: "app"
      DB_PASSWORD: "app"
    ports:
      - "8080:8080"

    # Hardening
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  lab12_db_data:
