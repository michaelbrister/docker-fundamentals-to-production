name: Lab 17 — Supply Chain Gates

on:
  workflow_dispatch:
  push:
    paths:
      - "labs/lab-17/**"

jobs:
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install Syft + Grype
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin
          syft version
          grype version

      - name: Load release version
        run: |
          cp labs/lab-17/.env.example labs/lab-17/.env
          echo "RELEASE_VERSION=$(grep '^RELEASE_VERSION=' labs/lab-17/.env | cut -d= -f2-)"

      - name: Build image (versioned tag)
        run: |
          set -euo pipefail
          source labs/lab-17/.env
          docker build -f labs/lab-17/api/Dockerfile.distroless -t dzth/mini-platform-api:${RELEASE_VERSION} labs/lab-17/api

      - name: Generate SBOM (SPDX JSON)
        run: |
          set -euo pipefail
          source labs/lab-17/.env
          syft dzth/mini-platform-api:${RELEASE_VERSION} -o spdx-json=labs/lab-17/sbom.json
          test -s labs/lab-17/sbom.json

      - name: Scan image (fail CRITICAL only)
        run: |
          set -euo pipefail
          source labs/lab-17/.env
          grype dzth/mini-platform-api:${RELEASE_VERSION} --fail-on critical
