name: lab-08

services:
  db:
    image: postgres:16-alpine
    container_name: lab08-db
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: appdb
    volumes:
      - lab08_db_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d appdb"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "5433:5432"

  adminer:
    image: adminer:4
    container_name: lab08-adminer
    depends_on:
      db:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "8082:8080"

  api:
    image: golang:1.22-alpine
    container_name: lab08-api
    working_dir: /app
    volumes:
      - ./api:/app
    environment:
      PORT: "8080"
      DB_HOST: "db"
      DB_PORT: "5432"
      DB_NAME: "appdb"
      DB_USER: "app"
      DB_PASSWORD: "app"
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-lc", "go mod tidy && go run ."]
    ports:
      - "8080:8080"

volumes:
  lab08_db_data:
