name: lab-11-s3

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: appdb
    volumes:
      - s3_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d appdb"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./api
    image: dzth/lab11-api:s3
    environment:
      PORT: "8080"
      DB_HOST: "db"
      DB_PORT: "5432"
      DB_NAME: "appdb"
      DB_USER: "app"
      DB_PASSWORD: "app"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"

volumes:
  s3_db_data:
